<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101E33">
<meta name="robots" content="noindex, nofollow">
<title>Transcrições — Índice de Ifá</title>
<link rel="icon" href="assets/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/transcricao.css">
</head>
<body>
<header class="top">
  <a href="index.html">‹ Índice</a>
  <h1>Biblioteca transcrita de Ifá</h1>
  <p>Texto extraído página a página dos três PDFs. Consulte as obras completas, pesquise no texto ou navegue pelos trechos agrupados por odu. Cada obra permanece identificada como fonte independente.</p>
</header>
<main>
  <nav class="tabs" aria-label="Tipo de transcrição">
    <button type="button" id="pataki-tab" aria-pressed="true">Por odu</button>
    <button type="button" id="ewe-tab" aria-pressed="false">Ewé indexado</button>
    <button type="button" id="full-tab" aria-pressed="false">Texto completo</button>
  </nav>
  <p id="transcript-coverage" class="coverage" aria-live="polite"></p>
  <section id="pataki-view">
    <label for="odu">Odu</label>
    <select id="odu"></select>
    <p id="odu-coverage" class="coverage" aria-live="polite"></p>
    <div class="source-grid">
      <article class="source-card">
        <header><h2>Naveira</h2><p id="n-coverage" class="source-coverage"></p></header>
        <p id="n-range" class="section-range"></p>
        <div id="n-content"></div>
      </article>
      <article class="source-card">
        <header><h2>Delgado</h2><p id="d-coverage" class="source-coverage"></p></header>
        <p id="d-range" class="section-range"></p>
        <div id="d-content"></div>
      </article>
    </div>
  </section>
  <section id="ewe-view" hidden>
    <label for="ewe-search">Buscar espécie, família ou nome yorùbá</label>
    <input id="ewe-search" type="search" autocomplete="off">
    <p id="ewe-count" aria-live="polite"></p>
    <div id="ewe-list"></div>
  </section>
  <section id="full-view" hidden>
    <div class="full-controls">
      <div>
        <label for="full-source">Obra</label>
        <select id="full-source">
          <option value="N">Naveira</option>
          <option value="D">Delgado</option>
          <option value="V">Verger</option>
        </select>
      </div>
      <div>
        <label for="full-page-number">Página</label>
        <div class="page-controls">
          <button type="button" id="previous-page" aria-label="Página anterior">‹</button>
          <input id="full-page-number" type="number" min="1" value="1" inputmode="numeric">
          <button type="button" id="next-page" aria-label="Próxima página">›</button>
        </div>
      </div>
    </div>
    <p id="full-coverage" class="coverage" aria-live="polite"></p>
    <label for="full-search">Buscar no texto desta obra</label>
    <input id="full-search" type="search" autocomplete="off">
    <p id="search-count" aria-live="polite"></p>
    <div id="search-results"></div>
    <article class="full-page">
      <header><h2 id="full-page-title"></h2><a id="full-page-link" target="ifa-leitor"></a></header>
      <pre id="full-page-text"></pre>
    </article>
  </section>
</main>
<script src="assets/transcricoes.js"></script>
<script src="assets/transcricao.js"></script>
</body>
</html>

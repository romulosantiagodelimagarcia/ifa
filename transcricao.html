<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101E33">
<meta name="robots" content="noindex, nofollow">
<title>Transcrições — Índice de Ifá</title>
<link rel="icon" href="assets/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/transcricao.css">
</head>
<body>
<header class="top">
  <a href="index.html">‹ Índice</a>
  <h1>Transcrições por odu</h1>
  <p>Listas independentes: cada coluna reproduz somente a fonte indicada. Os relatos não são pareados entre os tratados.</p>
</header>
<main>
  <nav class="tabs" aria-label="Tipo de transcrição">
    <button type="button" id="pataki-tab" aria-pressed="true">Patakís e demais trechos</button>
    <button type="button" id="ewe-tab" aria-pressed="false">Ewé · Verger</button>
  </nav>
  <section id="pataki-view">
    <label for="odu">Odu</label>
    <select id="odu"></select>
    <div class="columns">
      <section class="source" aria-labelledby="n-title">
        <h2 id="n-title">Naveira</h2>
        <div id="n-content"></div>
      </section>
      <section class="source" aria-labelledby="d-title">
        <h2 id="d-title">Delgado</h2>
        <div id="d-content"></div>
      </section>
    </div>
  </section>
  <section id="ewe-view" hidden>
    <label for="ewe-search">Buscar espécie, família ou nome yorùbá</label>
    <input id="ewe-search" type="search" autocomplete="off">
    <p id="ewe-count" aria-live="polite"></p>
    <div id="ewe-list"></div>
  </section>
</main>
<script src="assets/transcricoes.js"></script>
<script src="assets/transcricao.js"></script>
</body>
</html>
